name: Pearl Health
description: >-
  Pearl Health is a healthcare technology company that provides value-based care
  intelligence for physicians, primary care practices, physician networks, and
  health systems. Its platform acts as an operating system for value-based care,
  ingesting Medicare claims data, ADT feeds, and EHR information to identify
  high-risk patients, prioritize care activities with actionable next steps and
  automated administrative workflows, and optimize financial performance under
  Traditional Medicare and Medicare Advantage risk arrangements. Pearl reports
  serving 5,000+ providers across 40+ states, managing roughly 250,000
  beneficiaries. The company connects to existing EHR systems but does not
  publish a public developer API, SDK, or developer portal. This profile was
  surfaced as an a16z and SV Angel portfolio company and enriched from the
  provider's public web surface.
